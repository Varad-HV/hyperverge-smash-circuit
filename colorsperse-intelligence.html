const CASES = RAW_CASES.map((r, i) => ({
  id: "CMP-" + String(180 + i),
  client: r[0], team: r[1], employee: r[2], status: r[3], severity: r[4], category: r[5],
  description: r[6], hoursElapsed: r[7], daysAgo: r[8], diagnosis: r[9], action: r[10],
}));

/* ---- Derived: employees, KPIs, insight — all computed from the arrays above ---- */
function jitter(i, spread) { return (((i * 37) % 17) - 8) / 8 * spread; }
const TEAM_RESOLUTION_BASE = { Sales: 93, Finance: 98, Logistics: 82, QC: 88 };
const TEAM_HOUR_SPREAD = { Sales: 0.9, Finance: 0.35, Logistics: 2.3, QC: 1.5 };

const EMPLOYEES = TEAM_KEYS.flatMap((team) => {
  const names = EMPLOYEE_NAMES[team];
  const t = TEAM_BY_KEY[team];
  const perHead = t.weeklyEmails / names.length;
  return names.map((name, i) => {
    const hours = Math.max(0.4, +(t.avgHours + jitter(i, TEAM_HOUR_SPREAD[team])).toFixed(1));
    const emails = Math.max(10, Math.round(perHead + jitter(i, perHead * 0.3)));
    const cases = CASES.filter((c) => c.employee === name);
    const stuckCount = cases.filter((c) => c.status === "Stuck").length;
    let resolutionRate = Math.round(TEAM_RESOLUTION_BASE[team] + jitter(i + 3, 6) - stuckCount * 4);
    resolutionRate = Math.min(100, Math.max(64, resolutionRate));
    return { name, team, avgResponseHours: hours, emailsHandled: emails, complaintsFlagged: cases.length, resolutionRate };
  });
});

const TOTAL_EMAILS_WEEK = TEAM_KEYS.reduce((s, t) => s + TEAM_WEEKLY_EMAILS[t], 0);
const TOTAL_EMAILS_TODAY = 261;
const TOTAL_EMAILS_SPARK = [210, 205, 215, 225, 200, 205, 210].map((v, i) => ({ i, v }));

const OPEN_CASES = CASES.filter((c) => c.status !== "Resolved");
const STUCK_CASES = CASES.filter((c) => c.status === "Stuck");
const OPEN_COMPLAINTS = OPEN_CASES.length;
const OPEN_COMPLAINTS_LAST_WEEK = 17;
const OPEN_COMPLAINTS_SPARK = [15, 16, 15, 18, 19, 20, OPEN_COMPLAINTS].map((v, i) => ({ i, v }));
const STUCK_THREADS = STUCK_CASES.length;
const STUCK_THREADS_LAST_WEEK = 10;
const STUCK_THREADS_SPARK = [8, 9, 9, 10, 11, 12, STUCK_THREADS].map((v, i) => ({ i, v }));

const AVG_HOURS_THIS_WEEK = TEAMS.reduce((s, t) => s + t.avgHours * t.weeklyEmails, 0) / TOTAL_EMAILS_WEEK;
const AVG_HOURS_LAST_WEEK = TEAMS.reduce((s, t) => s + t.avgHoursLast * t.weeklyEmails, 0) / TOTAL_EMAILS_WEEK;
const AVG_HOURS_DELTA_PCT = ((AVG_HOURS_THIS_WEEK - AVG_HOURS_LAST_WEEK) / AVG_HOURS_LAST_WEEK) * 100;
const AVG_HOURS_SPARK = (() => {
  const days = [];
  for (let d = 7; d < 14; d++) {
    const v = TEAMS.reduce((s, t) => s + TEAM_TREND_14[t.key][d] * t.weeklyEmails, 0) / TOTAL_EMAILS_WEEK;
    days.push({ i: d, v: +v.toFixed(2) });
  }
  return days;
})();

function distributionFor(teamFilter) {

}

function buildInsight() {
  const logistics = TEAM_BY_KEY.Logistics;
  const finance = TEAM_BY_KEY.Finance;
  const oldLogistics = Math.round(logistics.deltaPct);
  const shipmentDelayStuck48 = CASES.filter(
    (c) => c.team === "Logistics" && c.category === "shipment delay" && c.status === "Stuck" && c.hoursElapsed > 48
  );
  const worstCase = [...STUCK_CASES].sort((a, b) => b.hoursElapsed - a.hoursElapsed)[0];
  const qcTrend = TEAM_TREND_14.QC;
  const qcLast2 = avg(qcTrend.slice(12, 14));
  const qcPrev2 = avg(qcTrend.slice(10, 12));
  const qcSpikePct = Math.round(((qcLast2 - qcPrev2) / qcPrev2) * 100);
  return {
    headline: `${shipmentDelayStuck48.length} unresolved Logistics complaints are dragging response times up ${oldLogistics}%`,
    body: `Logistics response times rose ${oldLogistics}% this week, driven by ${shipmentDelayStuck48.length} unresolved shipment delay complaints older than 48 hours — ${worstCase.client} has been waiting the longest, stuck for ${formatElapsedLong(worstCase.hoursElapsed)}. QC is showing an early warning sign of its own: average response time jumped ${qcSpikePct}% in just the last two days. Finance remains the benchmark at ${finance.avgHours}h average, and Sales is holding steady week over week.`,
  };
}

/* ============================================================

   ============================================================ */
function formatElapsedShort(hours) {
  if (hours < 24) return `${hours}h`;
  const d = Math.floor(hours / 24), h = hours % 24;
  return h ? `${d}d ${h}h` : `${d}d`;
}
function formatElapsedLong(hours) {
  if (hours < 1) return "under an hour";
  if (hours < 24) return `${hours} hour${hours === 1 ? "" : "s"}`;
  const d = Math.floor(hours / 24), h = hours % 24;
  const dayPart = `${d} day${d === 1 ? "" : "s"}`;
  return h ? `${dayPart}, ${h} hour${h === 1 ? "" : "s"}` : dayPart;
}
function fmt(n) { return n.toLocaleString("en-US"); }

function Sparkline({ data, color, height = 36, area = true }) {

              <stop offset="100%" stopColor={color} stopOpacity={0} />

            dot={(props) => {

              return <circle key={props.index} cx={props.cx} cy={props.cy} r={2.6} fill={color} stroke="white" strokeWidth={1.4} />;

function KPIRow({ teamFilter }) {
  const scope = teamFilter === "All" ? TEAM_KEYS : [teamFilter];
  const weekly = scope.reduce((s, t) => s + TEAM_WEEKLY_EMAILS[t], 0);
  const openComplaints = CASES.filter((c) => (teamFilter === "All" || c.team === teamFilter) && c.status !== "Resolved").length;
  const stuck = CASES.filter((c) => (teamFilter === "All" || c.team === teamFilter) && c.status === "Stuck").length;
  const avgHours = scope.reduce((s, t) => s + TEAM_BY_KEY[t].avgHours * TEAM_WEEKLY_EMAILS[t], 0) / weekly;
  const avgHoursLast = scope.reduce((s, t) => s + TEAM_BY_KEY[t].avgHoursLast * TEAM_WEEKLY_EMAILS[t], 0) / weekly;
  const avgDelta = ((avgHours - avgHoursLast) / avgHoursLast) * 100;
  const isAll = teamFilter === "All";

  return (
    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
      <KPICard icon="inbox" label={isAll ? "Emails handled this week" : `${teamFilter} emails this week`}
        value={fmt(weekly)} sub={isAll ? `${TOTAL_EMAILS_TODAY} today` : null}
        trendPct={isAll ? 2 : undefined} neutral trendData={isAll ? TOTAL_EMAILS_SPARK : undefined} />
      <KPICard icon="caseFile" label="Open complaints" value={fmt(openComplaints)}
        trendPct={isAll ? ((OPEN_COMPLAINTS - OPEN_COMPLAINTS_LAST_WEEK) / OPEN_COMPLAINTS_LAST_WEEK) * 100 : undefined}
        trendData={isAll ? OPEN_COMPLAINTS_SPARK : undefined}
        sub={`${CASES.filter(c => (teamFilter === "All" || c.team === teamFilter) && c.severity === "High" && c.status !== "Resolved").length} High severity`} />
      <KPICard icon="clock" label="Avg response time" value={`${avgHours.toFixed(1)}h`}
        trendPct={avgDelta} trendData={isAll ? AVG_HOURS_SPARK : undefined} />
      <KPICard icon="alertOctagon" label="Stuck threads (24h+)" value={fmt(stuck)}
        trendPct={isAll ? ((STUCK_THREADS - STUCK_THREADS_LAST_WEEK) / STUCK_THREADS_LAST_WEEK) * 100 : undefined}
        trendData={isAll ? STUCK_THREADS_SPARK : undefined} sub="No reply in 24 hours or more" />
    </div>
  );
}

      .filter((c) => status === "All" || c.status === status)

    if (!filtered.some((c) => c.id === selectedId)) setSelectedId(filtered[0].id);
    // eslint-disable-next-line
  }, [filtered]);

  const selected = filtered.find((c) => c.id === selectedId) || null;

  return (

      <div className="bg-white rounded-2xl border border-ink-200/60 p-4 shadow-card flex flex-wrap items-center gap-3">
        <div className="relative flex-1 min-w-[200px]">
          <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-300" />
          <input
            value={query} onChange={(e) => setQuery(e.target.value)}
            placeholder="Search client, employee, or issue&hellip;"
            className="w-full pl-9 pr-3 py-2 text-sm rounded-lg border border-ink-200 bg-white focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400"
          />
        </div>
        <select value={teamFilter} onChange={(e) => setTeamFilter(e.target.value)}
          className="text-sm font-medium rounded-lg border border-ink-200 py-2 pl-3 pr-8 bg-white focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400">
          <option value="All">All teams</option>
          {TEAM_KEYS.map((t) => <option key={t} value={t}>{t}</option>)}
        </select>
        <div className="flex items-center gap-1 bg-ink-100/60 rounded-lg p-1">
          {["All", "High", "Medium", "Low"].map((s) => (
            <button key={s} onClick={() => setSeverity(s)}
              className={`px-2.5 py-1.5 text-xs font-semibold rounded-md transition-colors ${severity === s ? "bg-white shadow-sm text-ink-900" : "text-ink-500 hover:text-ink-700"}`}>
              {s}
            </button>
          ))}

        <div className="flex items-center gap-1 bg-ink-100/60 rounded-lg p-1">
          {["All", "Stuck", "In Progress", "Resolved"].map((s) => (
            <button key={s} onClick={() => setStatus(s)}
              className={`px-2.5 py-1.5 text-xs font-semibold rounded-md transition-colors ${status === s ? "bg-white shadow-sm text-ink-900" : "text-ink-500 hover:text-ink-700"}`}>
              {s}
            </button>
          ))}
        </div>
        <span className="text-xs text-ink-400 ml-auto shrink-0">{filtered.length} of {CASES.length}</span>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-[380px_1fr] gap-4 items-start">
        <div className="bg-white rounded-2xl border border-ink-200/60 shadow-card overflow-hidden">
          <div className="max-h-[640px] overflow-y-auto">
            {filtered.map((c) => (
              <CaseListRow key={c.id} c={c} active={c.id === selectedId} onClick={() => setSelectedId(c.id)} />
            ))}
            {filtered.length === 0 && <div className="px-4 py-10 text-center text-ink-400 text-sm">No cases match these filters.</div>}
          </div>
        </div>
        <div className="bg-white rounded-2xl border border-ink-200/60 shadow-card p-6 lg:p-7 min-h-[500px]">
          <CaseDetail c={selected} />
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   EMPLOYEES PAGE
   ============================================================ */
function EmployeeCallout({ title, list, tone }) {
  const good = tone === "good";
  return (
    <div className="bg-white rounded-2xl border border-ink-200/60 shadow-card p-5">
      <h4 className={`text-[11px] font-bold uppercase tracking-wider mb-3 ${good ? "text-good-700" : "text-coral-700"}`}>{title}</h4>
      <div className="divide-y divide-ink-200/50">
        {list.map((e, i) => (
          <div key={e.name} className="flex items-center gap-3 py-2">
            <span className={`w-4 text-xs font-bold ${good ? "text-good-600" : "text-coral-600"}`}>{i + 1}</span>
            <Avatar name={e.name} team={e.team} size={26} />
            <div className="min-w-0 flex-1">
              <div className="text-[13px] font-semibold text-ink-900 truncate">{e.name}</div>
              <div className="text-[11px] text-ink-400">{e.team}</div>
            </div>
            <div className={`text-sm font-bold tabular ${good ? "text-good-700" : "text-coral-700"}`}>{e.avgResponseHours}h</div>
          </div>
        ))}
      </div>
    </div>
  );
}

const EMP_COLUMNS = [
  { key: "name", label: "Employee", numeric: false },
  { key: "team", label: "Team", numeric: false },
  { key: "emailsHandled", label: "Emails handled", numeric: true },
  { key: "avgResponseHours", label: "Avg response", numeric: true },
  { key: "complaintsFlagged", label: "Complaints", numeric: true },
  { key: "resolutionRate", label: "Resolution rate", numeric: true },
];

function EmployeesPage({ teamFilter, setTeamFilter }) {
  const [sortKey, setSortKey] = useState("avgResponseHours");
  const [sortDir, setSortDir] = useState("asc");
  const [query, setQuery] = useState("");

  const sorted = useMemo(() => [...EMPLOYEES].sort((a, b) => a.avgResponseHours - b.avgResponseHours), []);
  const top5 = sorted.slice(0, 5);
  const bottom5 = sorted.slice(-5).reverse();

  const rows = useMemo(() => {
    let list = EMPLOYEES.filter((e) => teamFilter === "All" || e.team === teamFilter);
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter((e) => e.name.toLowerCase().includes(q));
    }
    list = [...list].sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      const cmp = typeof av === "string" ? av.localeCompare(bv) : av - bv;
      return sortDir === "asc" ? cmp : -cmp;
    });
    return list;
  }, [teamFilter, query, sortKey, sortDir]);

  function toggleSort(key) {
    if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir(key === "resolutionRate" ? "desc" : "asc"); }
  }

  return (
    <div className="space-y-6 fade-in">
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        <EmployeeCallout title="Top 5 fastest responders" list={top5} tone="good" />
        <EmployeeCallout title="Bottom 5 slowest responders" list={bottom5} tone="bad" />
      </div>

      <div className="bg-white rounded-2xl border border-ink-200/60 shadow-card overflow-hidden">
        <div className="p-4 flex flex-wrap items-center gap-3 border-b border-ink-200/60">
          <div className="relative flex-1 min-w-[200px]">
            <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-300" />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search employee&hellip;"
              className="w-full pl-9 pr-3 py-2 text-sm rounded-lg border border-ink-200 focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400" />
          </div>
          <select value={teamFilter} onChange={(e) => setTeamFilter(e.target.value)}
            className="text-sm font-medium rounded-lg border border-ink-200 py-2 pl-3 pr-8 bg-white focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400">
            <option value="All">All teams</option>
            {TEAM_KEYS.map((t) => <option key={t} value={t}>{t}</option>)}
          </select>
          <span className="text-xs text-ink-400 ml-auto">{rows.length} of {EMPLOYEES.length}</span>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm min-w-[720px]">
            <thead className="bg-ink-100/40 text-ink-500 text-xs uppercase tracking-wide border-b border-ink-200/60">
              <tr>
                {EMP_COLUMNS.map((col) => (
                  <th key={col.key} className={`font-semibold px-4 py-3 select-none cursor-pointer hover:text-ink-800 ${col.numeric ? "text-right" : "text-left"}`}
                    onClick={() => toggleSort(col.key)}>
                    <span className={`inline-flex items-center gap-1 ${col.numeric ? "flex-row-reverse" : ""}`}>
                      {col.label}
                      <Icon name={sortKey === col.key ? (sortDir === "asc" ? "sortUp" : "sortDown") : "sort"} size={11} className={sortKey === col.key ? "text-brand-600" : "text-ink-300"} />
                    </span>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody className="divide-y divide-ink-200/50">
              {rows.map((e) => (
                <tr key={e.name} className="hover:bg-ink-100/30 transition-colors">
                  <td className="px-4 py-2.5">
                    <div className="flex items-center gap-2.5">
                      <Avatar name={e.name} team={e.team} size={26} />
                      <span className="font-medium text-ink-900 whitespace-nowrap">{e.name}</span>
                    </div>
                  </td>
                  <td className="px-4 py-2.5">
                    <span className="inline-flex items-center gap-1.5 text-ink-600">
                      <span className={`w-1.5 h-1.5 rounded-full ${TEAM_DOT[e.team]}`} />{e.team}
                    </span>
                  </td>
                  <td className="px-4 py-2.5 text-right tabular text-ink-700">{fmt(e.emailsHandled)}</td>
                  <td className={`px-4 py-2.5 text-right tabular font-semibold ${e.avgResponseHours > 5 ? "text-coral-600" : e.avgResponseHours < 2 ? "text-good-700" : "text-ink-800"}`}>{e.avgResponseHours}h</td>
                  <td className={`px-4 py-2.5 text-right tabular ${e.complaintsFlagged > 0 ? "text-ink-800 font-medium" : "text-ink-400"}`}>{e.complaintsFlagged}</td>
                  <td className="px-4 py-2.5 text-right tabular text-ink-700">{e.resolutionRate}%</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   RESPONSE TIME ANALYSIS PAGE
   ============================================================ */
function DistributionChart({ teamFilter }) {
  const data = useMemo(() => distributionFor(teamFilter), [teamFilter]);
  return (
    <div className="bg-white rounded-2xl border border-ink-200/60 p-5 shadow-card">
      <div className="flex items-center justify-between mb-1">
        <h3 className="font-display font-bold text-ink-900">Response time distribution</h3>
        <span className="text-xs text-ink-400">{teamFilter === "All" ? "All teams" : teamFilter}</span>
      </div>
      <p className="text-xs text-ink-500 mb-4">How quickly threads got a first reply this week</p>
      <div style={{ width: "100%", height: 240 }}>
        <ResponsiveContainer width="100%" height="100%">
          <BarChart data={data} margin={{ top: 4, right: 8, left: -12, bottom: 0 }}>
            <CartesianGrid vertical={false} stroke="#EEECF7" />
            <XAxis dataKey="label" tick={{ fontSize: 12, fill: "#7C7793" }} axisLine={{ stroke: "#DCD9EB" }} tickLine={false} />
            <YAxis tick={{ fontSize: 12, fill: "#7C7793" }} axisLine={false} tickLine={false} allowDecimals={false} />
            <Tooltip cursor={{ fill: "#F7F6FB" }} contentStyle={{ borderRadius: 10, border: "1px solid #E6E3EF", fontSize: 13 }} formatter={(v) => [fmt(v), "Threads"]} />
            <Bar dataKey="count" radius={[6, 6, 0, 0]}>
              {data.map((d, i) => <Cell key={d.label} fill={BIN_COLOR[i]} />)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

function TeamComparisonChart() {
  const data = TEAMS.map((t) => ({ team: t.key, "This week": t.avgHours, "Last week": t.avgHoursLast }));
  return (
    <div className="bg-white rounded-2xl border border-ink-200/60 p-5 shadow-card">
      <h3 className="font-display font-bold text-ink-900 mb-1">Team-by-team comparison</h3>
      <p className="text-xs text-ink-500 mb-4">Average response time, this week vs last week</p>
      <div style={{ width: "100%", height: 240 }}>
        <ResponsiveContainer width="100%" height="100%">
          <BarChart data={data} margin={{ top: 4, right: 8, left: -12, bottom: 0 }} barGap={4}>
            <CartesianGrid vertical={false} stroke="#EEECF7" />
            <XAxis dataKey="team" tick={{ fontSize: 12, fill: "#7C7793" }} axisLine={{ stroke: "#DCD9EB" }} tickLine={false} />
            <YAxis tick={{ fontSize: 12, fill: "#7C7793" }} axisLine={false} tickLine={false} unit="h" />
            <Tooltip contentStyle={{ borderRadius: 10, border: "1px solid #E6E3EF", fontSize: 13 }} />
            <Legend wrapperStyle={{ fontSize: 12 }} iconType="circle" iconSize={8} />
            <Bar dataKey="Last week" fill="#C7C3D6" radius={[6, 6, 0, 0]} />
            <Bar dataKey="This week" radius={[6, 6, 0, 0]}>
              {data.map((d) => <Cell key={d.team} fill={TEAM_COLOR[d.team]} />)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

function FourteenDayTrend() {
  const data = Array.from({ length: 14 }, (_, i) => {
    const row = { day: i - 13 };
    TEAM_KEYS.forEach((t) => { row[t] = TEAM_TREND_14[t][i]; });
    return row;
  });
  return (
    <div className="bg-white rounded-2xl border border-ink-200/60 p-5 shadow-card">
      <h3 className="font-display font-bold text-ink-900 mb-1">14-day trend, by team</h3>
      <p className="text-xs text-ink-500 mb-4">Average response time (hours), each point is one day</p>
      <div style={{ width: "100%", height: 280 }}>
        <ResponsiveContainer width="100%" height="100%">
          <LineChart data={data} margin={{ top: 4, right: 8, left: -12, bottom: 0 }}>
            <CartesianGrid vertical={false} stroke="#EEECF7" />
            <XAxis dataKey="day" tick={{ fontSize: 11, fill: "#7C7793" }} axisLine={{ stroke: "#DCD9EB" }} tickLine={false}
              tickFormatter={(v) => (v === 0 ? "today" : `${v}d`)} />
            <YAxis tick={{ fontSize: 12, fill: "#7C7793" }} axisLine={false} tickLine={false} unit="h" />
            <Tooltip contentStyle={{ borderRadius: 10, border: "1px solid #E6E3EF", fontSize: 13 }} labelFormatter={(v) => (v === 0 ? "Today" : `${Math.abs(v)} days ago`)} />
            <Legend wrapperStyle={{ fontSize: 12 }} iconType="circle" iconSize={8} />
            <ReferenceLine x={-2} stroke="#B4740A" strokeDasharray="4 3" strokeOpacity={0.5} />
            {TEAM_KEYS.map((t) => (
              <Line key={t} type="monotone" dataKey={t} stroke={TEAM_COLOR[t]} strokeWidth={2.2} dot={false} activeDot={{ r: 4 }} isAnimationActive={false} />
            ))}
          </LineChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

function ResponseTimePage({ teamFilter }) {
  return (
    <div className="space-y-4 fade-in">
      <DistributionChart teamFilter={teamFilter} />
      <TeamComparisonChart />
      <FourteenDayTrend />
    </div>
  );
}

/* ============================================================
   SETTINGS PAGE (static)
   ============================================================ */
function SettingsRow({ label, desc, control }) {
  return (
    <div className="flex items-center justify-between gap-4 py-4 border-b border-ink-200/50 last:border-0">
      <div>
        <div className="text-sm font-semibold text-ink-800">{label}</div>
        <div className="text-xs text-ink-400 mt-0.5">{desc}</div>
      </div>
      {control}
    </div>
  );
}
function Toggle({ on }) {
  return (
    <span className={`inline-flex w-9 h-5 rounded-full items-center px-0.5 shrink-0 ${on ? "bg-brand-600 justify-end" : "bg-ink-200 justify-start"}`}>
      <span className="w-4 h-4 rounded-full bg-white shadow" />
    </span>
  );
}
function SettingsPage() {
  return (
    <div className="fade-in max-w-2xl">
      <div className="bg-white rounded-2xl border border-ink-200/60 shadow-card p-6">
        <h3 className="font-display font-bold text-ink-900 mb-1">Workspace settings</h3>
        <p className="text-xs text-ink-500 mb-2">Static preview — configuration isn't wired up in this demo.</p>
        <div className="mt-4">
          <SettingsRow label="Daily digest email" desc="Send Today's Insight to team leads every morning at 8:00" control={<Toggle on={true} />} />
          <SettingsRow label="Stuck-thread alerts" desc="Notify a channel when a thread passes 24 hours with no reply" control={<Toggle on={true} />} />
          <SettingsRow label="Auto-escalate High severity" desc="Ping the team lead automatically for new High severity cases" control={<Toggle on={false} />} />
          <SettingsRow label="Weekly leadership summary" desc="A rollup of team performance sent every Monday" control={<Toggle on={true} />} />
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   SHELL — sidebar, top bar, page routing
   ============================================================ */
const NAV_ITEMS = [
  { key: "overview", label: "Overview", icon: "grid" },
  { key: "complaints", label: "Complaints & Stuck Threads", icon: "caseFile" },
  { key: "employees", label: "Employees", icon: "users" },
  { key: "response", label: "Response Time Analysis", icon: "activity" },
  { key: "settings", label: "Settings", icon: "settings" },
];
const PAGE_META = {
  overview: { title: "Overview", sub: "How Colorsperse is handling client email, today" },
  complaints: { title: "Complaints & Stuck Threads", sub: "Every flagged case, why it's stuck, and what to do next" },
  employees: { title: "Employees", sub: "Response performance across all 60 team members" },
  response: { title: "Response Time Analysis", sub: "Distribution, team comparison, and the 14-day trend" },
  settings: { title: "Settings", sub: "Workspace preferences" },
};

function Logo({ size = 30 }) {
  return (
    <span className="rounded-xl flex items-center justify-center shrink-0" style={{ width: size, height: size, background: "linear-gradient(135deg,#6C5CD9,#4B3FBE)" }}>
      <svg width={size * 0.56} height={size * 0.56} viewBox="0 0 24 24" fill="none">
        <path d="M9 18.5c0-5.5 3-9 7.5-9 3 0 5 1.6 5 4" stroke="white" strokeWidth="2.3" fill="none" strokeLinecap="round" />
        <circle cx="19.5" cy="7.5" r="2" fill="#F2A93B" />
      </svg>
    </span>
  );
}

function Sidebar({ page, setPage, mobile = false }) {
  return (
    <aside className={mobile
      ? "flex flex-col w-72 shrink-0 bg-charcoal-950 h-full"
      : "hidden lg:flex lg:flex-col w-64 shrink-0 bg-charcoal-950 h-screen sticky top-0"}>
      <div className="flex items-center gap-2.5 px-5 h-16 border-b border-white/[0.06]">
        <Logo />
        <div className="leading-tight">
          <div className="font-display font-extrabold text-white text-[15px] tracking-tight">Colorsperse</div>
          <div className="text-[10.5px] text-charcoal-400 font-medium uppercase tracking-wider">Intelligence</div>
        </div>
      </div>
      <nav className="flex-1 px-3 py-4 space-y-0.5">
        {NAV_ITEMS.map((item) => {
          const isActive = page === item.key;
          return (
            <button key={item.key} onClick={() => setPage(item.key)}
              className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-[13.5px] font-medium transition-colors ${
                isActive ? "bg-brand-600 text-white shadow-pop" : "text-charcoal-200 hover:bg-white/[0.06] hover:text-white"
              }`}>
              <Icon name={item.icon} size={16} />
              <span className="flex-1 text-left leading-snug">{item.label}</span>
            </button>
          );
        })}
      </nav>
      <div className="p-4 border-t border-white/[0.06]">
        <div className="flex items-center gap-2 text-[11px] text-charcoal-400">
          <span className="w-1.5 h-1.5 rounded-full bg-good-600" />Synced 4 min ago
        </div>
      </div>
    </aside>
  );
}

function TopBar({ page, teamFilter, setTeamFilter, onMenu }) {
  const meta = PAGE_META[page];
  const showFilter = page !== "settings";
  return (
    <header className="sticky top-0 z-10 bg-[#F7F6FB]/90 backdrop-blur border-b border-ink-200/60 px-5 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div className="flex items-center gap-3 min-w-0">
        <button onClick={onMenu} className="lg:hidden w-8 h-8 rounded-lg border border-ink-200 flex items-center justify-center text-ink-500 shrink-0">
          <Icon name="grid" size={16} />
        </button>
        <div className="min-w-0">
          <h1 className="font-display text-lg font-bold text-ink-900 leading-tight truncate">{meta.title}</h1>
          <p className="text-xs text-ink-400 truncate hidden sm:block">{meta.sub}</p>
        </div>
      </div>
      <div className="flex items-center gap-2 shrink-0">
        <div className="hidden md:flex items-center gap-1.5 text-xs font-medium text-ink-500 bg-ink-100/70 px-3 py-1.5 rounded-full">
          <Icon name="clock" size={13} />Sat, 18 Jul 2026
        </div>
        {showFilter && (
          <div className="relative">
            <select value={teamFilter} onChange={(e) => setTeamFilter(e.target.value)}
              className="text-sm font-medium rounded-lg border border-ink-200 py-2 pl-3 pr-8 bg-white focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 appearance-none">
              <option value="All">All teams</option>
              {TEAM_KEYS.map((t) => <option key={t} value={t}>{t}</option>)}
            </select>
            <Icon name="chevronDown" size={14} className="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-ink-400" />
          </div>
        )}
      </div>
    </header>
  );
}

function App() {
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState("overview");
  const [teamFilter, setTeamFilter] = useState("All");
  const [mobileOpen, setMobileOpen] = useState(false);

  useEffect(() => { const t = setTimeout(() => setLoading(false), 600); return () => clearTimeout(t); }, []);

  return (
    <div className="flex bg-[#F7F6FB] min-h-screen font-body">
      <Sidebar page={page} setPage={setPage} />

      {mobileOpen && (
        <div className="fixed inset-0 z-40 lg:hidden">
          <div className="absolute inset-0 bg-charcoal-950/50" onClick={() => setMobileOpen(false)} />
          <div className="absolute left-0 top-0 h-full w-72 shadow-xl">
            <Sidebar mobile page={page} setPage={(k) => { setPage(k); setMobileOpen(false); }} />
          </div>
        </div>
      )}

      <div className="flex-1 min-w-0">
        <TopBar page={page} teamFilter={teamFilter} setTeamFilter={setTeamFilter} onMenu={() => setMobileOpen(true)} />
        <main className="p-5 lg:p-8 max-w-[1400px]">
          {loading ? <PageSkeleton /> : (
            <React.Fragment>
              {page === "overview" && <OverviewPage teamFilter={teamFilter} setTeamFilter={setTeamFilter} />}
              {page === "complaints" && <ComplaintsPage teamFilter={teamFilter} setTeamFilter={setTeamFilter} />}
              {page === "employees" && <EmployeesPage teamFilter={teamFilter} setTeamFilter={setTeamFilter} />}
              {page === "response" && <ResponseTimePage teamFilter={teamFilter} />}
              {page === "settings" && <SettingsPage />}
            </React.Fragment>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
